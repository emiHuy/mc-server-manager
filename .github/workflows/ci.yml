name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l config minecraft main.go)
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...
      
      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...