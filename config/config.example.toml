# Copy to config/config.toml. Full reference: docs/configuration.md

[api]
host = "127.0.0.1" # "127.0.0.1", "0.0.0.0", or "tailscale"
port = 8080
token = "<generated_token>" # required unless host is loopback; run: ./mc-server-manager token

[minecraft]
# Windows paths: use single quotes so backslashes are not treated as escapes.
directory = '<minecraft server directory path>'
# Use the full path to the real java.exe; plain "java" can leave the server running after a kill on Windows.
command = 'C:\Program Files\Java\jdk-version\bin\java.exe'
jar_file = "server.jar"
min_memory = "4G"
max_memory = "4G"
gui = false
stop_timeout = "30s"   # needs a unit (s, m); minimum 1s
startup_timeout = "2m" # needs a unit (s, m); minimum 5s
autostart = true

[auto_restart]
enabled = true
max_restarts = 5
initial_backoff = "5s" # needs a unit (s, m); minimum 1s

[backup]
directory = "backups"
keep = 7              # newest backups to retain
world = "world"       # world folder inside minecraft.directory
flush_timeout = "30s" # max wait for "Saved the game"
interval = "24h"      # omit or 0 to turn off automatic backups

[options]
log_level = "info" # debug, info, warn, error
