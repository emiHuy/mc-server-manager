[api]
# Host address to bind the API and web dashboard to.
# - Use "127.0.0.1" for localhost only.
# - Use "0.0.0.0" for all network interfaces.
# - Use "tailscale" to automatically discover and bind to your Tailscale IP.
host = "127.0.0.1"
port = 8080
token = "<generated_token>" # optional

[minecraft]
# Windows paths: use single quotes so backslashes are not treated as escapes.
directory = '<minecraft server directory path>'
# Use the full path to the real java.exe; plain "java" can leave the server running after a kill on Windows.
command = 'C:\Program Files\Java\jdk-version\bin\java.exe'
jar_file = "server.jar"
min_memory = "4G"
max_memory = "4G"
gui = false
stop_timeout = "30s" # needs a unit (s, m); minimum 1s
startup_timeout = "2m"
autostart = true

[auto_restart]
enabled = true
max_restarts = 5
initial_backoff = "5s"

[backup]
directory = "backups"       # where backups are written
keep = 7                    # how many newest backups to retain
folders_to_save = ["world"] # list of folder names inside minecraft.directory
flush_timeout = "30s"       # max wait for "Saved the game"

[options]
log_level = "debug"
